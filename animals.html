<!DOCTYPE html>

	<title>Mrs. Schillinger's Animal Games</title>

	<div class="transition-curtain"></div>

					<li><a id="cow">Cow</a></li>
					<li><a id="dog">Dog</a></li>
					<li><a id="goat">Goat</a></li>

					<li><a id="pig">Pig</a></li>
					<li><a id="sheep">Sheep</a></li>

			</li>

				<div class="select">
					<span class="selected">Body Systems</span>

					<li><a id="directionalDog">Dog</a></li>

			</li>

				<li class="dropdown">
				<div class="select">

				</div>
				<ul class="menu">
					<li><a>Coming Soon</a></li>
				</ul>
			</li>
			</ul>

				<div class="box-area">
					<div class="part1">
						<div id="game">
							<h1 id="title">Choose a Game</h1>
							<iframe src="" allowtransparency="true" width="727.5" height="603" frameborder="0" scrolling="no" allowfullscreen></iframe>

					</div>

					<div class="footer" id="animal">

						</a>

				</div>
			</div>

	<script src="https://unpkg.com/@barba/core"></script>
	<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
	<script src="animalScript.js"></script>

	<img src="images/cow.png" class="animal-bg cow-bg" alt="">
